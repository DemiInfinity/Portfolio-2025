name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        package: [frontend, admin, backend]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Run unit tests
        run: |
          cd packages/${{ matrix.package }}
          yarn test:coverage || yarn test
        continue-on-error: true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/${{ matrix.package }}/coverage/coverage-final.json
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}-coverage
        continue-on-error: true

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The e2e suites never touch the real API or database. The site reads
      # from a fixture mock API (cypress/support/frontend/mock-api.mjs), and the
      # admin specs stub every request with cy.intercept.
      - name: Start mock API (:4010)
        run: |
          nohup node cypress/support/frontend/mock-api.mjs > /tmp/mock-api.log 2>&1 &
          npx wait-on http-get://localhost:4010/api/projects -t 30000

      - name: Build and start the site (:3000)
        run: |
          cd packages/frontend
          yarn build
          nohup yarn start > /tmp/site.log 2>&1 &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4010
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Build and preview the admin (:3002)
        run: |
          cd packages/admin
          yarn build
          nohup npx vite preview --port 3002 --strictPort > /tmp/admin.log 2>&1 &
        env:
          VITE_API_URL: http://localhost:4010
          VITE_SITE_URL: http://localhost:3000

      - name: Wait for both apps
        run: npx wait-on http://localhost:3000 http://localhost:3002 -t 120000

      - name: Cypress, site
        uses: cypress-io/github-action@v6
        with:
          install: false
          spec: cypress/e2e/frontend/**/*.feature
          config: baseUrl=http://localhost:3000

      - name: Cypress, admin
        uses: cypress-io/github-action@v6
        with:
          install: false
          spec: cypress/e2e/admin/**/*.feature,cypress/e2e/admin-login.feature
          config: baseUrl=http://localhost:3002
        env:
          CYPRESS_ADMIN_URL: http://localhost:3002

      - name: Server logs
        if: failure()
        run: tail -n 80 /tmp/mock-api.log /tmp/site.log /tmp/admin.log || true

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos
          path: cypress/videos

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Demi's Portfolio Brag</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/TextPlugin.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

      body {
        margin: 0;
        background: #000;
        color: #2d3436;
        font-family: 'Poppins', system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      
      /* Scene 1 */
      #scene-1 { background: #000; color: #fff; font-family: 'JetBrains Mono', monospace; }
      #hook-text { font-size: 64px; font-weight: 500; letter-spacing: -1px; }
      
      /* Scene 2 */
      #scene-2 {
        background: linear-gradient(135deg, #f8f4ff 0%, #fff8f0 50%, #ffb3ba 100%);
      }
      .gradient-text {
        background: linear-gradient(45deg, #ff6b9d, #c44569);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-family: 'Playfair Display', serif;
        font-size: 140px;
        font-weight: 800;
        text-align: center;
      }
      .floating-hearts {
        position: absolute;
        font-size: 80px;
        opacity: 0.6;
      }
      .sparkles {
        position: absolute;
        font-size: 60px;
        opacity: 0.4;
      }

      /* Scene 3 */
      #scene-3 {
        background: linear-gradient(135deg, #f8f4ff 0%, #fff8f0 50%, #ffb3ba 100%);
      }
      .card-girly {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        border: 1px solid rgba(255, 192, 203, 0.5);
        box-shadow: 0 12px 40px rgba(255, 107, 157, 0.15);
        padding: 60px;
        width: 800px;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 30px;
      }
      .card-girly::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 8px;
        background: linear-gradient(45deg, #ff6b9d, #c44569);
      }
      .tech-tag {
        background: linear-gradient(45deg, rgba(255, 107, 157, 0.1), rgba(196, 69, 105, 0.1));
        color: #c44569;
        border: 2px solid rgba(255, 107, 157, 0.3);
        padding: 16px 32px;
        border-radius: 30px;
        font-size: 32px;
        font-weight: 600;
        text-align: center;
        opacity: 0;
      }

      /* Scene 4 */
      #scene-4 {
        background: linear-gradient(135deg, #f8f4ff 0%, #fff8f0 50%, #ffb3ba 100%);
      }
      #outro-name {
        font-family: 'Playfair Display', serif;
        font-size: 120px;
        font-weight: 800;
        color: #2d3436;
        margin-bottom: 20px;
      }
      #outro-title {
        font-size: 48px;
        font-weight: 500;
        color: #c44569;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="18"
    >
      <!-- Audio -->
      <audio id="bg-music" data-start="3" data-duration="15" data-track-index="10" data-volume="0.4" src="assets/music/happy-beats-business-moves-vol-10-by-ende-dot-app.mp3"></audio>
      
      <!-- Scene 1: The Setup (0-3s) -->
      <section id="scene-1" class="clip" data-start="0" data-duration="3">
        <div id="hook-text"></div>
      </section>

      <!-- Scene 2: The Reveal (3-7s) -->
      <section id="scene-2" class="clip" data-start="3" data-duration="4">
        <div class="floating-hearts" id="h1" style="top: 20%; left: 15%;">💖</div>
        <div class="floating-hearts" id="h2" style="top: 70%; left: 80%;">💖</div>
        <div class="sparkles" id="s1" style="top: 30%; left: 75%;">✨</div>
        <div class="sparkles" id="s2" style="top: 60%; left: 20%;">✨</div>
        <div class="gradient-text" id="reveal-text">But make it cute.</div>
      </section>

      <!-- Scene 3: Tech Stack (7-12s) -->
      <section id="scene-3" class="clip" data-start="7" data-duration="5">
        <div class="card-girly" id="tech-card">
          <div class="tech-tag" id="tag-1">Next.js</div>
          <div class="tech-tag" id="tag-2">Express.js</div>
          <div class="tech-tag" id="tag-3">PostgreSQL</div>
          <div class="tech-tag" id="tag-4">React CMS</div>
        </div>
      </section>

      <!-- Scene 4: Outro (12-18s) -->
      <section id="scene-4" class="clip" data-start="12" data-duration="6">
        <div id="outro-name">Demi Taylor Nimmo</div>
        <div id="outro-title">Software Engineer ✨</div>
      </section>
    </div>

    <script>
      gsap.registerPlugin(TextPlugin);
      const tl = gsap.timeline({ paused: true });

      // Scene 1
      tl.to("#hook-text", { text: "ARCHITECTURE: FULL-STACK MONOREPO", duration: 1.5, ease: "none" }, 0.5);

      // Scene 2 (Starts at 3s)
      tl.fromTo("#scene-2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3);
      tl.fromTo("#reveal-text", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.7)" }, 3.2);
      
      // Float animations for hearts/sparkles
      tl.to(["#h1", "#h2"], { y: -30, rotation: 10, duration: 2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3);
      tl.to(["#s1", "#s2"], { scale: 1.2, opacity: 0.8, duration: 1.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3);

      // Scene 3 (Starts at 7s)
      tl.fromTo("#scene-3", { xPercent: 100 }, { xPercent: 0, duration: 0.6, ease: "power3.out" }, 7);
      tl.fromTo("#tech-card", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 7.2);
      
      // Sequential tech tags
      tl.fromTo("#tag-1", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 7.8);
      tl.fromTo("#tag-2", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 8.3);
      tl.fromTo("#tag-3", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 8.8);
      tl.fromTo("#tag-4", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 9.3);

      // Scene 4 (Starts at 12s)
      tl.fromTo("#scene-4", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 12);
      tl.fromTo("#outro-name", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power2.out" }, 12.4);
      tl.fromTo("#outro-title", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power2.out" }, 12.8);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
